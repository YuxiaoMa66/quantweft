<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Three-point ordinary least squares example</title><desc id="desc">Observations (-1,1), (0,2), (1,4). Candidate lines y=2, y=2+x and OLS y=7/3+3x/2. Dotted segments show OLS residuals.</desc><rect width="760" height="430" fill="#f7f9f8"/><g stroke="#536663" stroke-width="1"><path d="M90 350H690 M110 365V45" fill="none"/><path d="M230 345v10 M410 345v10 M590 345v10"/></g><g font-family="sans-serif" font-size="14" fill="#172c2b"><text x="695" y="355">x</text><text x="104" y="34">y</text><text x="216" y="380">-1</text><text x="406" y="380">0</text><text x="585" y="380">1</text><text x="230" y="410">Arbitrary teaching units / 教学单位</text></g><path d="M176 222H644" stroke="#708783" stroke-width="2" stroke-dasharray="8 5"/><path d="M176 305.2L644 138.8" stroke="#a06b20" stroke-width="2" stroke-dasharray="10 4 2 4"/><path d="M176 325.47L644 75.87" stroke="#17685d" stroke-width="3"/><path d="M230 286V296.67 M410 222V200.67 M590 94V104.67" stroke="#8d4260" stroke-width="2" stroke-dasharray="2 3"/><g fill="#172c2b"><circle cx="230" cy="286" r="5"/><circle cx="410" cy="222" r="5"/><circle cx="590" cy="94" r="5"/></g><g font-family="sans-serif" font-size="14" fill="#172c2b"><text x="495" y="243">ŷ = 2</text><text x="185" y="325">ŷ = 2 + x</text><text x="442" y="125">OLS: ŷ = 7/3 + 3x/2</text></g></svg>
