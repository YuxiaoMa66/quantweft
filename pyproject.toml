[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-course-a1"
version = "0.1.0"
description = "Shared research interfaces for the Chinese quantitative finance course"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "polars",
  "scipy",
  "matplotlib",
  "statsmodels",
  "scikit-learn",
  "cvxpy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "nbformat",
  "nbclient",
  "ipykernel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
